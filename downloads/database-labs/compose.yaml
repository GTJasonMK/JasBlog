name: enterprise-db-study

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_DB: db_lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:?请先设置实验密码 LAB_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/16/docker
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/00-schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./sql/01-seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d db_lab"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
